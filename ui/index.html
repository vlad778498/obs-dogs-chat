<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Собаки чата — OBS</title>
<link rel="stylesheet" href="/static/dogs.css">
</head>
<body>
  <div id="scene">
    <!-- газон, по которому собаки бродят у нижнего края экрана -->
    <div id="lawn"></div>

    <!-- будка справа: из неё собаки выходят на выгул, модераторы сидят на крыше -->
    <div id="kennel">
      <div class="roof"><span class="chimney"></span><span class="sign">МОДЕРАТОРЫ</span></div>
      <div class="body">
        <div class="door"></div>
      </div>
      <div id="mod-roost"><!-- собаки-модераторы на крыше --></div>
    </div>

    <div id="yard"><!-- бродячие собаки-чатеры --></div>

    <div id="header">
      <span class="paw">🐾</span>
      <span id="counter">0 активных</span>
    </div>
    <div id="status">подключение…</div>
  </div>
  <script src="/static/dogs.js"></script>
</body>
</html>
