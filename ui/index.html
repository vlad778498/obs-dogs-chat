<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Собаки чата — OBS</title>
<link rel="stylesheet" href="/static/dogs.css">
</head>
<body>
  <div id="scene">
    <!-- будка справа (картинка из ui/assets/kennel.png, до неё — заглушка).
         z-index у будки НИЖЕ зоны собак: чатеры гуляют ПЕРЕД конурой -->
    <div id="kennel"></div>

    <!-- зона выгула: собаки ходят ТОЛЬКО влево-вправо по нижнему краю экрана -->
    <div id="yard"><!-- бродячие собаки-чатеры --></div>

    <!-- модераторы на крыше. Вынесены из #kennel в отдельный слой поверх всей
         сцены, иначе внутри будки (z-index:2) они оказались бы ПОД собаками.
         Координаты слоя точно совпадают с будкой (см. .roost-layer в dogs.css) -->
    <div class="roost-layer"><div id="mod-roost"><!-- модераторы на крыше --></div></div>

    <!-- служебные pre-load картинки для определения naturalWidth/Height PNG -->
    <div id="metrics" aria-hidden="true"></div>

    <!-- тестовая панель: НЕ видна в OBS (body.obs), только в браузере.
         Позволяет рисовать и проверять ассеты без Twitch -->
    <div id="testbar">
      <button id="t-add">+ собака</button>
      <button id="t-remove">− собака</button>
      <button id="t-mod">🛡️ модератор</button>
      <button id="t-assets">🔄 перезагрузить ассеты</button>
      <span id="assets-info">заглушки</span>
    </div>
  </div>
  <script src="/static/dogs.js"></script>
</body>
</html>
